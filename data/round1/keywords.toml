# Keep a record if its title or abstract matches a [topic] term and a [context] term.
# `word*` matches any word starting with "word". Hyphens and punctuation count as spaces.
# F1, F2 and D are the protocol search string.

[topic]
F1 = [
  "metastab*",
  "congestion collapse",
  "congestive collapse",
  "cascading failure*",
  "failure cascade*",
  "retry storm*",
  "thundering herd",
  "vicious cycle*",
]
F2 = [
  "overload*",
  "work amplification",
  "retry amplification",
  "flash crowd*",
  "load spike*",
  "traffic spike*",
]
