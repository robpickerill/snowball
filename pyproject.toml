[project]
name = "slr-snowball"
version = "1.0.0"
description = "Backward and forward citation snowballing for systematic literature reviews (OpenAlex, Crossref, Semantic Scholar)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
slr-snowball = "slr_snowball.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data"] 

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # ruff format handles line length

[tool.ruff.lint.isort]
known-first-party = ["slr_snowball"]
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
